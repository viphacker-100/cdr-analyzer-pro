<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="cdr-mark-title">
  <title id="cdr-mark-title">CDR Analyzer Pro Logo Mark</title>
  <defs>
    <linearGradient id="cdr-bg" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="cdr-amber" x1="54" y1="36" x2="74" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Rounded navy badge (DESIGN SYSTEM Primary #1E40AF / Foreground #1E3A8A) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cdr-bg)" />
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2" />

  <!-- Telemetry bars (data density accent) -->
  <rect x="24" y="80" width="14" height="24" rx="4" fill="#3B82F6" fill-opacity="0.38" />
  <rect x="46" y="70" width="14" height="34" rx="4" fill="#3B82F6" fill-opacity="0.48" />
  <rect x="68" y="62" width="14" height="42" rx="4" fill="#60A5FA" fill-opacity="0.38" />
  <rect x="90" y="54" width="14" height="50" rx="4" fill="#60A5FA" fill-opacity="0.45" />

  <!-- Signal waves radiating from top-right target node -->
  <path d="M 85 20 A 21 21 0 0 1 104 39" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.92" />
  <path d="M 88 12 A 30 30 0 0 1 112 36" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- CDR Call Graph Edges -->
  <path d="M 31 74 L 60 46 L 94 35" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 46 L 93 80" fill="none" stroke="#93C5FD" stroke-width="5.5" stroke-linecap="round" />

  <!-- Correlated Nodes -->
  <circle cx="31" cy="74" r="8.5" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5" />
  <circle cx="94" cy="35" r="8" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="93" cy="80" r="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" />

  <!-- Central Target / Hub Node (Amber CTA Highlight #D97706 / #FBBF24) -->
  <circle cx="60" cy="46" r="12" fill="#1E3A8A" />
  <circle cx="60" cy="46" r="9.5" fill="url(#cdr-amber)" />
  <circle cx="60" cy="46" r="3.2" fill="#FFFFFF" />
</svg>

