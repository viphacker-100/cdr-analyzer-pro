<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-labelledby="cdr-logo-title">
  <title id="cdr-logo-title">CDR Analyzer Pro</title>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="560" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="icon-bg" x1="16" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Banner Card (High-contrast across both light & dark themes) -->
  <rect x="2" y="2" width="556" height="124" rx="22" fill="url(#banner-bg)" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2" />

  <!-- Subtle Grid Accents on Right -->
  <path d="M 480 18 L 542 18 M 498 30 L 542 30 M 512 42 L 542 42" stroke="#3B82F6" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" />

  <!-- Emblem Mark -->
  <g transform="translate(18, 16) scale(0.75)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#icon-bg)" />
    <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="2" />
    <rect x="24" y="80" width="14" height="24" rx="4" fill="#93C5FD" fill-opacity="0.30" />
    <rect x="46" y="70" width="14" height="34" rx="4" fill="#93C5FD" fill-opacity="0.40" />
    <rect x="68" y="62" width="14" height="42" rx="4" fill="#FFFFFF" fill-opacity="0.30" />
    <rect x="90" y="54" width="14" height="50" rx="4" fill="#FFFFFF" fill-opacity="0.38" />
    <path d="M 85 20 A 21 21 0 0 1 104 39" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" />
    <path d="M 88 12 A 30 30 0 0 1 112 36" fill="none" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round" stroke-opacity="0.78" />
    <path d="M 31 74 L 60 46 L 94 35" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60 46 L 93 80" fill="none" stroke="#93C5FD" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="31" cy="74" r="8.5" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.5" />
    <circle cx="94" cy="35" r="8" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="93" cy="80" r="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" />
    <circle cx="60" cy="46" r="12" fill="#1E3A8A" />
    <circle cx="60" cy="46" r="9.5" fill="url(#amber-grad)" />
    <circle cx="60" cy="46" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Primary Typography -->
  <text x="134" y="61" fill="#F8FAFC" font-family="'Fira Code', 'Cascadia Mono', 'Consolas', monospace" font-size="31" font-weight="700" letter-spacing="-0.6">
    CDR Analyzer
  </text>

  <!-- PRO Badge (Amber Accent #D97706) -->
  <rect x="366" y="34" width="58" height="30" rx="15" fill="url(#amber-grad)" />
  <text x="395" y="54" text-anchor="middle" fill="#0F172A" font-family="'Fira Code', 'Cascadia Mono', 'Consolas', monospace" font-size="15" font-weight="700" letter-spacing="0.8">
    PRO
  </text>

  <!-- Subtitle -->
  <text x="135" y="88" fill="#93C5FD" font-family="'Fira Sans', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="500" letter-spacing="1.4">
    CALL DETAIL RECORD INTELLIGENCE
  </text>

  <!-- Subtle offline & version telemetry tag -->
  <rect x="135" y="99" width="124" height="17" rx="5" fill="#3B82F6" fill-opacity="0.22" />
  <text x="197" y="111" text-anchor="middle" fill="#DBEAFE" font-family="'Fira Code', 'Cascadia Mono', 'Consolas', monospace" font-size="9.5" font-weight="600" letter-spacing="0.4">
    LOCAL-FIRST · v2.1
  </text>
</svg>
